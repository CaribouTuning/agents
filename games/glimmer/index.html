<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1020">
<title>Glimmer</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0d1020; overflow: hidden;
    /* Nothing in the page should ever scroll, zoom or select. */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 14px 0;
    pointer-events: none; z-index: 5;
    color: #fdf8e7; font-size: 15px; letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(20, 28, 44, 0.55);
  }
  #hud b { font-weight: 700; color: #ffe98a; }
  #rotate {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #0d1020; color: #f8f4e4; text-align: center; gap: 10px;
    font-size: 13px; letter-spacing: 1px; z-index: 10;
  }
  #rotate span { font-size: 30px; }
  @media (orientation: portrait) and (max-height: 520px) {
    #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 14px 0;
    pointer-events: none; z-index: 5;
    color: #fdf8e7; font-size: 15px; letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(20, 28, 44, 0.55);
  }
  #hud b { font-weight: 700; color: #ffe98a; }
  #rotate { display: flex; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><span>&#9670;</span><b id="lums">0</b></div>
  <div id="rotate"><span>&#8635;</span>TURN YOUR PHONE SIDEWAYS</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
