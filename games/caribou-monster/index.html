<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1020">
<title>Caribou Monster</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0d1020; overflow: hidden;
    /* Nothing in the page should ever scroll, zoom or select. */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #rotate {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #0d1020; color: #f8f4e4; text-align: center; gap: 10px;
    font-size: 13px; letter-spacing: 1px; z-index: 10;
  }
  #rotate span { font-size: 30px; }
  @media (orientation: portrait) and (max-height: 520px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate"><span>&#8635;</span>TURN YOUR PHONE SIDEWAYS</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
