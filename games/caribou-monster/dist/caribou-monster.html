// Fixed-timestep game loop. Logic runs at a stable 60 Hz regardless of
// display refresh (phones vary between 60 and 120), rendering happens once
// per animation frame.

  constructor({ update, render }) {
    this.update = update;
    this.render = render;
    this.acc = 0;
    this.last = 0;
    this.running = false;
    this.frame = 0;
    this.fps = 60;
    this._fpsAcc = 0;
    this._fpsFrames = 0;
    this._tick = this._tick.bind(this);
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    requestAnimationFrame(this._tick);
  }

  stop() { this.running = false; }

  _tick(now) {
    if (!this.running) return;
    requestAnimationFrame(this._tick);

    let dt = (now - this.last) / 1000;
    this.last = now;
    if (dt > 0.25) dt = 0.25; // came back from background

    this.acc += dt;
    let steps = 0;
    while (this.acc >= STEP && steps < MAX_STEPS) {
      this.update(STEP);
      this.acc -= STEP;
      steps++;
      this.frame++;

    if (steps === MAX_STEPS) this.acc = 0;

    this.render(this.acc / STEP);

    this._fpsAcc += dt;
    this._fpsFrames++;
    if (this._fpsAcc >= 0.5) {
      this.fps = Math.round(this._fpsFrames / this._fpsAcc);

  }

// ships zero audio assets and still has real music. Three voices, roughly

// systems publish, screens subscribe. No wildcard matching on purpose.

    return () => this.off(name, fn);
  }

  once(name, fn) {
    const un = this.on(name, (...a) => { un(); fn(...a); });

  emit(name, payload) {

    if (!set) return;

    for (const fn of [...set]) {

function buildTileAtlas() {
  const chars = Object.keys(TILES);
  const surf = makeSurface(chars.length * TILE, MAX_ANIM * TILE);
  chars.forEach((ch, i) => {
    slot.set(ch, i);

      surf.ctx.save();
      surf.ctx.translate(i * TILE, f * TILE);
      surf.ctx.beginPath();
      surf.ctx.rect(0, 0, TILE, TILE);
      surf.ctx.clip();
      def.draw(surf.ctx, src);
      surf.ctx.restore();
    }
  });
  atlas = surf.canvas;
  return atlas;
}

      if (!f) continue;
      for (let i = 0; i < 3; i++) {
        const v = d[o + i];
        out[o + i] = f > 0 ? v + (255 - v) * f : v * (1 + f);
      }
    }
  }
  ctx.putImageData(new ImageData(out, w, h), 0, 0);
}

function outlinePass(surf, color) {
  const { ctx, w, h } = surf;
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
  const pts = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (op(x, y)) continue;
    if (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1)) pts.push([x, y]);
  }
  ctx.fillStyle = color;
  for (const [x, y] of pts) ctx.fillRect(x, y, 1, 1);
}

// ---- face ------------------------------------------------------------

function face(c, S, hx, hy, hr, p, opts = {}) {
  const eyeR = Math.max(1, hr * (opts.eyeSize || 0.30));
  const dx = hr * (opts.eyeSpread || 0.46);
  const ey = hy - hr * (opts.eyeY != null ? opts.eyeY : 0.08);
  for (const sx of [-1, 1]) {
    ell(c, hx + sx * dx, ey, eyeR, eyeR * 1.12, p.eyeWhite || '#f8f8ff');
    ell(c, hx + sx * dx + (opts.pupilShift || 0), ey + eyeR * 0.12, eyeR * 0.62, eyeR * 0.78, p.eye);
    c.fillStyle = '#ffffff';
    c.fillRect(Math.round(hx + sx * dx - eyeR * 0.5), Math.round(ey - eyeR * 0.6), 1, 1);
  }
  if (opts.mouth !== false) {
    c.fillStyle = p.line;
    const my = hy + hr * (opts.mouthY || 0.52);
    const mw = Math.max(1, Math.round(hr * 0.34));
    c.fillRect(Math.round(hx - mw / 2), Math.round(my), mw, 1);
    if (opts.fang) {
      c.fillStyle = '#ffffff';
      c.fillRect(Math.round(hx - mw / 2), Math.round(my + 1), 1, 1);
      c.fillRect(Math.round(hx + mw / 2 - 1), Math.round(my + 1), 1, 1);
    }
  }
  if (opts.beak) {
    tri(c, hx - hr * 0.30, hy + hr * 0.30, hx + hr * 0.30, hy + hr * 0.30,
      hx, hy + hr * 0.95, p.accent);
  }
}

// ---- archetypes ------------------------------------------------------
// Each receives the drawing context, sprite size S, palette p, and a build
// spec b (fractions of S). They return the head position so features can
// attach to it.

const ARCH = {
  quadruped(c, S, p, b) {
    const bodyCx = S * 0.54, bodyCy = S * 0.58;
    const bw = S * (b.bodyW || 0.28), bh = S * (b.bodyH || 0.22);
    const legLen = S * (b.legLen || 0.15), legW = S * (b.legW || 0.13);
    // Back legs first so the near pair overlaps them.
    for (const [lx, sc, col] of [[-0.62, 0.88, shade(p.primary, -0.20)], [0.62, 0.88, shade(p.primary, -0.20)],
                                 [-0.42, 1, p.primary], [0.82, 1, p.primary]]) {
      const fx = bodyCx + bw * lx;
      limb(c, fx, bodyCy + bh * 0.55, fx, bodyCy + bh * 0.55 + legLen * sc, legW, legW * 0.92, col);
    }
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.44, bw * 0.74, bh * 0.46, p.belly);
    const hr = S * (b.headR || 0.19);
    const hx = S * (b.headX || 0.28), hy = S * (b.headY || 0.36);
    limb(c, bodyCx - bw * 0.55, bodyCy - bh * 0.35, hx + hr * 0.35, hy + hr * 0.45, S * 0.17, S * 0.15, p.primary);
    ell(c, hx, hy, hr, hr * 0.92, p.primary);
    ell(c, hx - hr * 0.16, hy + hr * 0.44, hr * 0.66, hr * 0.42, p.belly);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  biped(c, S, p, b) {
    const bodyCx = S * 0.50, bodyCy = S * 0.58;
    const bw = S * (b.bodyW || 0.20), bh = S * (b.bodyH || 0.22);
    const legLen = S * (b.legLen || 0.20);
    for (const sx of [-1, 1]) {
      limb(c, bodyCx + sx * bw * 0.5, bodyCy + bh * 0.7, bodyCx + sx * bw * 0.72,
        bodyCy + bh * 0.7 + legLen, S * 0.11, S * 0.10, p.primary);
      c.fillStyle = p.accent;
      c.fillRect(Math.round(bodyCx + sx * bw * 0.72 - S * 0.06), Math.round(bodyCy + bh * 0.7 + legLen - S * 0.03),
        Math.round(S * 0.12), Math.max(1, Math.round(S * 0.05)));
    }
    for (const sx of [-1, 1]) {
      limb(c, bodyCx + sx * bw * 0.85, bodyCy - bh * 0.25, bodyCx + sx * bw * 1.35,
        bodyCy + bh * 0.45, S * 0.09, S * 0.075, p.primary);
    }
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.25, bw * 0.66, bh * 0.6, p.belly);
    const hr = S * (b.headR || 0.19);
    const hx = bodyCx, hy = bodyCy - bh - hr * 0.55;
    ell(c, hx, hy, hr, hr * 0.96, p.primary);
    ell(c, hx, hy + hr * 0.38, hr * 0.66, hr * 0.46, p.belly);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  bird(c, S, p, b) {
    const bodyCx = S * 0.50, bodyCy = S * 0.58;
    const bw = S * (b.bodyW || 0.24), bh = S * (b.bodyH || 0.24);
    for (const sx of [-1, 1]) {
      limb(c, bodyCx + sx * bw * 0.35, bodyCy + bh * 0.85, bodyCx + sx * bw * 0.42,
        bodyCy + bh * 0.85 + S * 0.12, S * 0.05, S * 0.045, p.accent);
      c.fillStyle = p.accent;
      c.fillRect(Math.round(bodyCx + sx * bw * 0.42 - S * 0.05), Math.round(bodyCy + bh * 0.85 + S * 0.11),
        Math.round(S * 0.11), Math.max(1, Math.round(S * 0.04)));
    }
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.28, bw * 0.62, bh * 0.6, p.belly);
    const hr = S * (b.headR || 0.16);
    const hx = bodyCx - S * 0.02, hy = bodyCy - bh - hr * 0.4;
    ell(c, hx, hy, hr, hr, p.primary);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  bug(c, S, p, b) {
    const bodyCx = S * 0.54, bodyCy = S * 0.58;
    const bw = S * (b.bodyW || 0.26), bh = S * (b.bodyH || 0.17);
    for (let i = 0; i < 3; i++) {
      for (const sx of [-1, 1]) {
        const ax = bodyCx + (i - 1) * bw * 0.55;
        limb(c, ax, bodyCy + bh * 0.5, ax + sx * S * 0.11, bodyCy + bh * 0.5 + S * 0.13,
          S * 0.045, S * 0.03, p.accent);
      }
    }
    for (let i = 0; i < 3; i++) {
      const seg = bodyCx + (1 - i) * bw * 0.62;
      ell(c, seg, bodyCy, bw * (0.52 - i * 0.06), bh * (1 - i * 0.08), i % 2 ? shade(p.primary, -0.12) : p.primary);
    }
    const hr = S * (b.headR || 0.15);
    const hx = bodyCx - bw * 0.95, hy = bodyCy - bh * 0.22;
    ell(c, hx, hy, hr, hr * 0.9, p.secondary);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  fish(c, S, p, b) {
    const bodyCx = S * 0.52, bodyCy = S * 0.54;
    const bw = S * (b.bodyW || 0.28), bh = S * (b.bodyH || 0.20);
    tri(c, bodyCx + bw * 0.85, bodyCy, bodyCx + bw * 1.7, bodyCy - bh * 0.95,
      bodyCx + bw * 1.7, bodyCy + bh * 0.95, p.accent);
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.4, bw * 0.72, bh * 0.46, p.belly);
    tri(c, bodyCx, bodyCy - bh * 0.7, bodyCx + bw * 0.6, bodyCy - bh * 1.5,
      bodyCx - bw * 0.3, bodyCy - bh * 0.9, p.secondary);
    const hr = S * (b.headR || 0.15);
    const hx = bodyCx - bw * 0.72, hy = bodyCy - bh * 0.14;
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  serpent(c, S, p, b) {
    const bodyCx = S * 0.52, bodyCy = S * 0.60;
    const bw = S * (b.bodyW || 0.30), bh = S * (b.bodyH || 0.16);
    // Coil: ellipses swept along an S so the body reads as a snake, not a lump.
    const N = 16;
    for (let i = N - 1; i >= 0; i--) {
      const t = i / (N - 1);
      const x = bodyCx + Math.sin(t * Math.PI * 1.6) * bw * 0.85 - bw * 0.15;
      const y = bodyCy + bh * 0.75 - t * S * 0.42;
      const r = S * (0.115 - t * 0.055);
      ell(c, x, y, r, r * 0.9, i % 2 ? p.primary : shade(p.primary, -0.10));
      if (t < 0.5) ell(c, x, y + r * 0.45, r * 0.55, r * 0.35, p.belly);
    }
    const hr = S * (b.headR || 0.16);
    const hx = bodyCx + Math.sin(Math.PI * 1.6) * bw * 0.85 - bw * 0.15;
    const hy = bodyCy + bh * 0.75 - S * 0.42 - hr * 0.4;
    ell(c, hx, hy, hr * 1.15, hr * 0.88, p.primary);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  blob(c, S, p, b) {
    const bodyCx = S * 0.50, bodyCy = S * 0.60;
    const bw = S * (b.bodyW || 0.28), bh = S * (b.bodyH || 0.26);
    for (const sx of [-1, 1]) ell(c, bodyCx + sx * bw * 0.5, bodyCy + bh * 0.92, S * 0.07, S * 0.045, p.accent);
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.3, bw * 0.66, bh * 0.56, p.belly);
    const hr = S * (b.headR || 0.20);
    return { hx: bodyCx, hy: bodyCy - bh * 0.18, hr, bodyCx, bodyCy, bw, bh };
  },

  rodent(c, S, p, b) {
    const bodyCx = S * 0.54, bodyCy = S * 0.66;
    const bw = S * (b.bodyW || 0.22), bh = S * (b.bodyH || 0.17);
    for (const [lx, ly] of [[-0.6, 0.7], [0.6, 0.7]]) {
      limb(c, bodyCx + bw * lx, bodyCy + bh * ly, bodyCx + bw * lx, bodyCy + bh * ly + S * 0.11,
        S * 0.08, S * 0.07, p.primary);
    }
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.35, bw * 0.7, bh * 0.5, p.belly);
    const hr = S * (b.headR || 0.21);
    const hx = bodyCx - bw * 0.42, hy = bodyCy - bh - hr * 0.42;
    ell(c, hx, hy, hr, hr * 0.9, p.primary);
    ell(c, hx - hr * 0.1, hy + hr * 0.44, hr * 0.6, hr * 0.4, p.belly);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },

  golem(c, S, p, b) {
    const bodyCx = S * 0.50, bodyCy = S * 0.56;
    const bw = S * (b.bodyW || 0.27), bh = S * (b.bodyH || 0.25);
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    c.fillStyle = shade(p.primary, -0.18);
    for (let i = 0; i < 5; i++) {
      const a = i * 1.31;
      c.fillRect(Math.round(bodyCx + Math.cos(a) * bw * 0.55), Math.round(bodyCy + Math.sin(a) * bh * 0.55),
        Math.max(1, Math.round(S * 0.06)), Math.max(1, Math.round(S * 0.05)));
    }
    for (const sx of [-1, 1]) {
      limb(c, bodyCx + sx * bw * 0.80, bodyCy + bh * 0.18, bodyCx + sx * bw * 1.45,
        bodyCy + bh * 0.82, S * 0.085, S * 0.075, p.secondary);
      ell(c, bodyCx + sx * bw * 1.5, bodyCy + bh * 0.9, S * 0.085, S * 0.080, p.accent);
    }
    const hr = S * (b.headR || 0.19);
    return { hx: bodyCx, hy: bodyCy - bh * 0.28, hr, bodyCx, bodyCy, bw, bh };
  },

  bat(c, S, p, b) {
    const bodyCx = S * 0.50, bodyCy = S * 0.54;
    const bw = S * (b.bodyW || 0.15), bh = S * (b.bodyH || 0.18);
    for (const sx of [-1, 1]) {
      tri(c, bodyCx + sx * bw * 0.6, bodyCy - bh * 0.6, bodyCx + sx * S * 0.46, bodyCy - bh * 1.5,
        bodyCx + sx * S * 0.40, bodyCy + bh * 1.1, p.secondary);
      tri(c, bodyCx + sx * bw * 0.6, bodyCy - bh * 0.3, bodyCx + sx * S * 0.34, bodyCy - bh * 0.9,
        bodyCx + sx * S * 0.30, bodyCy + bh * 0.9, shade(p.secondary, -0.16));
    }
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    const hr = S * (b.headR || 0.15);
    return { hx: bodyCx, hy: bodyCy - bh * 0.5, hr, bodyCx, bodyCy, bw, bh };
  },

  // Stately deer/caribou plan — reserved for the legendary.
  stag(c, S, p, b) {
    const bodyCx = S * 0.52, bodyCy = S * 0.58;
    const bw = S * (b.bodyW || 0.28), bh = S * (b.bodyH || 0.16);
    for (const [lx, ly] of [[-0.7, 0.4], [0.6, 0.4], [-0.45, 0.8], [0.8, 0.8]]) {
      limb(c, bodyCx + bw * lx, bodyCy + bh * ly, bodyCx + bw * lx * 1.06,
        bodyCy + bh * ly + S * 0.24, S * 0.065, S * 0.045, p.primary);
    }
    ell(c, bodyCx, bodyCy, bw, bh, p.primary);
    ell(c, bodyCx, bodyCy + bh * 0.45, bw * 0.7, bh * 0.4, p.belly);
    const hr = S * (b.headR || 0.13);
    const hx = S * 0.24, hy = S * 0.28;
    limb(c, bodyCx - bw * 0.6, bodyCy - bh * 0.5, hx + hr * 0.4, hy + hr * 0.5, S * 0.10, S * 0.085, p.primary);
    ell(c, hx, hy, hr * 1.15, hr * 0.8, p.primary);
    return { hx, hy, hr, bodyCx, bodyCy, bw, bh };
  },
};

// ---- features --------------------------------------------------------
// Drawn after the body, positioned relative to the head/body it returns.

const FEAT = {
  earsRound(c, S, p, g) {
    for (const sx of [-1, 1]) ell(c, g.hx + sx * g.hr * 0.78, g.hy - g.hr * 0.62, g.hr * 0.38, g.hr * 0.38, p.primary);
    for (const sx of [-1, 1]) ell(c, g.hx + sx * g.hr * 0.78, g.hy - g.hr * 0.62, g.hr * 0.20, g.hr * 0.20, p.accent);
  },
  earsPointed(c, S, p, g) {
    for (const sx of [-1, 1]) {
      tri(c, g.hx + sx * g.hr * 0.35, g.hy - g.hr * 0.6, g.hx + sx * g.hr * 1.0, g.hy - g.hr * 0.4,
        g.hx + sx * g.hr * 0.85, g.hy - g.hr * 1.5, p.primary);
    }
  },
  earsLong(c, S, p, g) {
    for (const sx of [-1, 1]) {
      limb(c, g.hx + sx * g.hr * 0.45, g.hy - g.hr * 0.7, g.hx + sx * g.hr * 0.75, g.hy - g.hr * 2.3,
        g.hr * 0.34, g.hr * 0.26, p.primary);
      limb(c, g.hx + sx * g.hr * 0.5, g.hy - g.hr * 0.9, g.hx + sx * g.hr * 0.75, g.hy - g.hr * 2.1,
        g.hr * 0.16, g.hr * 0.12, p.accent);
    }
  },
  earsTuft(c, S, p, g) {
    for (const sx of [-1, 1]) {
      tri(c, g.hx + sx * g.hr * 0.5, g.hy - g.hr * 0.75, g.hx + sx * g.hr * 1.05, g.hy - g.hr * 0.5,
        g.hx + sx * g.hr * 1.15, g.hy - g.hr * 1.8, p.accent);
    }
  },
  horn(c, S, p, g) {
    tri(c, g.hx - g.hr * 0.22, g.hy - g.hr * 0.9, g.hx + g.hr * 0.22, g.hy - g.hr * 0.9,
      g.hx, g.hy - g.hr * 2.0, p.accent);
  },
  antlers(c, S, p, g) {
    for (const sx of [-1, 1]) {
      limb(c, g.hx + sx * g.hr * 0.5, g.hy - g.hr * 0.6, g.hx + sx * g.hr * 1.2, g.hy - g.hr * 2.6,
        S * 0.045, S * 0.028, p.accent);
      limb(c, g.hx + sx * g.hr * 0.85, g.hy - g.hr * 1.6, g.hx + sx * g.hr * 2.1, g.hy - g.hr * 2.0,
        S * 0.032, S * 0.020, p.accent);
      limb(c, g.hx + sx * g.hr * 1.05, g.hy - g.hr * 2.2, g.hx + sx * g.hr * 2.0, g.hy - g.hr * 3.0,
        S * 0.030, S * 0.018, p.accent);
    }
  },
  crest(c, S, p, g) {
    tri(c, g.hx - g.hr * 0.5, g.hy - g.hr * 0.8, g.hx + g.hr * 0.3, g.hy - g.hr * 0.9,
      g.hx - g.hr * 0.2, g.hy - g.hr * 1.9, p.accent);
  },
  mane(c, S, p, g) {
    for (let i = 0; i < 7; i++) {
      const a = -0.4 + i * 0.55;
      ell(c, g.hx + Math.cos(a) * g.hr * 1.25, g.hy + Math.sin(a) * g.hr * 1.25, g.hr * 0.42, g.hr * 0.42, p.accent);
    }
  },
  leaf(c, S, p, g) {
    ell(c, g.hx + g.hr * 0.1, g.hy - g.hr * 1.35, g.hr * 0.62, g.hr * 0.30, p.accent);
    limb(c, g.hx, g.hy - g.hr * 0.9, g.hx + g.hr * 0.1, g.hy - g.hr * 1.3, S * 0.035, S * 0.025, shade(p.accent, -0.3));
  },
  sprout(c, S, p, g) {
    limb(c, g.hx, g.hy - g.hr * 0.8, g.hx, g.hy - g.hr * 1.7, S * 0.035, S * 0.03, shade(p.accent, -0.25));
    ell(c, g.hx - g.hr * 0.5, g.hy - g.hr * 1.7, g.hr * 0.42, g.hr * 0.26, p.accent);
    ell(c, g.hx + g.hr * 0.5, g.hy - g.hr * 1.8, g.hr * 0.42, g.hr * 0.26, p.accent);
  },
  bloom(c, S, p, g) {
    for (let i = 0; i < 5; i++) {
      const a = i * (Math.PI * 2 / 5) - Math.PI / 2;
      ell(c, g.hx + Math.cos(a) * g.hr * 0.7, g.hy - g.hr * 1.5 + Math.sin(a) * g.hr * 0.7,
        g.hr * 0.38, g.hr * 0.38, p.accent);
    }
    ell(c, g.hx, g.hy - g.hr * 1.5, g.hr * 0.28, g.hr * 0.28, '#f8e070');
  },
  shell(c, S, p, g) {
    ell(c, g.bodyCx + g.bw * 0.12, g.bodyCy - g.bh * 0.42, g.bw * 0.88, g.bh * 0.82, p.secondary);
    c.fillStyle = shade(p.secondary, -0.22);
    for (let i = -1; i <= 1; i++) {
      c.fillRect(Math.round(g.bodyCx + g.bw * (0.12 + i * 0.4) - 1), Math.round(g.bodyCy - g.bh * 0.9),
        Math.max(1, Math.round(S * 0.03)), Math.max(1, Math.round(g.bh * 1.0)));
    }
  },
  flameTail(c, S, p, g) {
    const tx = g.bodyCx + g.bw * 1.45, ty = g.bodyCy - g.bh * 0.25;
    limb(c, g.bodyCx + g.bw * 0.75, g.bodyCy + g.bh * 0.1, tx, ty, S * 0.07, S * 0.05, p.primary);
    ell(c, tx + S * 0.02, ty - S * 0.14, S * 0.095, S * 0.13, '#e85820');
    ell(c, tx + S * 0.02, ty - S * 0.16, S * 0.062, S * 0.090, '#f8a030');
    ell(c, tx + S * 0.01, ty - S * 0.18, S * 0.032, S * 0.050, '#f8e070');
  },
  bushyTail(c, S, p, g) {
    ell(c, g.bodyCx + g.bw * 1.15, g.bodyCy - g.bh * 0.5, g.bw * 0.42, g.bh * 0.9, p.secondary);
    ell(c, g.bodyCx + g.bw * 1.2, g.bodyCy - g.bh * 0.8, g.bw * 0.26, g.bh * 0.5, p.accent);
  },
  starTail(c, S, p, g) {
    limb(c, g.bodyCx + g.bw * 0.8, g.bodyCy, g.bodyCx + g.bw * 1.5, g.bodyCy - g.bh * 1.2,
      S * 0.05, S * 0.035, p.primary);
    const tx = g.bodyCx + g.bw * 1.55, ty = g.bodyCy - g.bh * 1.35;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 4;
      c.fillStyle = p.accent;
      c.fillRect(Math.round(tx + Math.cos(a) * S * 0.06 - 1), Math.round(ty + Math.sin(a) * S * 0.06 - 1), 2, 2);
    }
    ell(c, tx, ty, S * 0.055, S * 0.055, p.accent);

function rotateHue(hex, deg) {

//
// Flags are the single source of truth for progression, which matters for

  GOT_STARTER: 'gotStarter',
  MET_RIVAL: 'metRival',
  BEAT_RIVAL_1: 'beatRival1',
  LEFT_TOWN: 'leftTown',
  ENTERED_FOREST: 'enteredForest',
  FOREST_GRUNT: 'forestGrunt',
  REACHED_ALDERMERE: 'reachedOreburgh',
  BEAT_RIVAL_2: 'beatRival2',
  BEAT_RIVAL_3: 'beatRival3',
  BADGE_1: 'badge1',
  ENTERED_CAVE: 'enteredCave',
  GOT_CHARM: 'gotCharm',
  BEAT_COMMANDER: 'beatCommander',
  KNOWS_TWIST: 'knowsTwist',
  MARS_LATE: 'marsLate',
  EVERLIGHT_OPENED: 'everlightOpened',
  EVERLIGHT_RESOLVED: 'everlightResolved',
  CAUGHT_EVERLIGHT: 'caughtEverlight',
};

// Milestones that co-op partners keep in step, in the order they happen.
const SHARED_MILESTONES = [
  FLAGS.GOT_STARTER, FLAGS.LEFT_TOWN, FLAGS.ENTERED_FOREST, FLAGS.FOREST_GRUNT,
  FLAGS.REACHED_ALDERMERE, FLAGS.BADGE_1, FLAGS.ENTERED_CAVE, FLAGS.BEAT_COMMANDER,
  FLAGS.CAUGHT_EVERLIGHT,
];

function createFlags() { return {}; }

function setFlag(flags, key, value = true) {
  const changed = flags[key] !== value;
  flags[key] = value;
  return changed;
}

function getFlag(flags, key) { return !!flags[key]; }

// "your partner is further ahead" rather than silently desyncing.
function storyProgress(flags) {
  let n = 0;
  for (const m of SHARED_MILESTONES) { if (flags[m]) n++; else break; }
  return n;
}

function progressLabel(n) {

    'Just starting out', 'On the road', 'In Route 202', 'Through the forest',
    'In Oreburgh', 'One badge', 'Into Oreburgh Gate', 'Faced Galactic',
    'Woke the Everlight',

};

//
// Lives apart from the registry so map files can import `defineMap` without

// needless fragility.


function defineMap(id, def) {
  const rows = def.tiles;

    if (r.length !== w) {
      throw new Error(`[map ${id}] row ${i} is ${r.length} wide, expected ${w}: "${r}"`);

    for (const ch of r) {
      if (!TILES[ch]) throw new Error(`[map ${id}] row ${i} uses unknown tile '${ch}'`);
    }
  });
  return {
    id,
    name: def.name || id,
    kind: def.kind || 'route',      // town | route | indoor | cave
    music: def.music || 'route',
    tiles: rows,
    width: w,
    height: rows.length,
    warps: def.warps || [],
    npcs: def.npcs || [],
    objects: def.objects || [],     // ground items
    signs: def.signs || [],
    encounters: def.encounters || null,
    events: def.events || [],       // scripted triggers on step
    darkEdges: def.darkEdges !== false,
    healPoint: def.healPoint || null,
  };
}

__defs['game/friendship.js'] = function (__x, __req) {

// Friendship.
//
// Every Pokémon has carried a `friendship` value since the first commit, the
// evolution resolver reads it, and nothing ever changed it — so a friendship
// evolution could never fire and the number on the summary screen was a
// constant 70 pretending to be a relationship.
//
// The rules are the series' own, simplified: it grows from levelling and from
// winning, and it falls when a Pokémon faints. Walking with it helps a little.

const FRIENDSHIP_MAX = 255;
const FRIENDSHIP_START = 70;

/** Gains shrink as a Pokémon gets fonder of you, the way the games do it. */
function bandGain(value, base) {
  if (value >= 200) return Math.max(1, Math.round(base * 0.4));
  if (value >= 100) return Math.max(1, Math.round(base * 0.7));
  return base;
}

function adjustFriendship(mon, base) {
  if (!mon) return 0;
  const before = mon.friendship || 0;
  const delta = base > 0 ? bandGain(before, base) : base;
  mon.friendship = Math.max(0, Math.min(FRIENDSHIP_MAX, before + delta));
  return mon.friendship - before;
}

const FRIENDSHIP_EVENTS = {
  levelUp: 3,
  wonBattle: 1,
  caught: 0,
  walked: 1,          // per 128 steps, and only for the lead Pokémon
  fainted: -5,
  usedBitterItem: -5,
};

function onLevelUp(mon) { return adjustFriendship(mon, FRIENDSHIP_EVENTS.levelUp); }
function onWonBattle(mon) { return adjustFriendship(mon, FRIENDSHIP_EVENTS.wonBattle); }
function onFainted(mon) { return adjustFriendship(mon, FRIENDSHIP_EVENTS.fainted); }
function onWalked(mon) { return adjustFriendship(mon, FRIENDSHIP_EVENTS.walked); }

/** Words rather than a number, because 174 means nothing to a player. */
function friendshipLabel(mon) {
  const v = mon.friendship || 0;
  if (v >= 250) return 'Inseparable';
  if (v >= 200) return 'Devoted';
  if (v >= 150) return 'Very friendly';
  if (v >= 100) return 'Friendly';
  if (v >= 70) return 'Warming up';
  if (v >= 30) return 'Wary';
  return 'Distant';
}

__exports(__x, { FRIENDSHIP_MAX: () => FRIENDSHIP_MAX, FRIENDSHIP_START: () => FRIENDSHIP_START, adjustFriendship: () => adjustFriendship, FRIENDSHIP_EVENTS: () => FRIENDSHIP_EVENTS, onLevelUp: () => onLevelUp, onWonBattle: () => onWonBattle, onFainted: () => onFainted, onWalked: () => onWalked, friendshipLabel: () => friendshipLabel });

    name: 'The Everlight', canRun: true, monster: { friendship: 0 },

    await speak(ctx, EVERLIGHT.fled);

    await speak(ctx, EVERLIGHT.declined);
  }

    await ctx.wait(0.5);

    ctx.autosave();
  }
};

    out.push({ t: 'text', s: 'There is no running from a trainer battle!' });
    return;
  }
  const mine = effectiveStat(battle, sideIdx, 'spe');
  const theirs = effectiveStat(battle, foeIndex(sideIdx), 'spe');
  side.runAttempts += 1;
  const attempts = side.runAttempts;
  const odds = theirs > 0 ? ((mine * 128) / theirs + 30 * attempts) % 256 : 256;
  const runner = activeOf(side);
  if (ability.alwaysFlees(runner) || mine >= theirs || battle.rng.int(256) < odds) {
    out.push({ t: 'sfx', s: 'escape' });
    out.push({ t: 'text', s: 'Got away safely!' });
    battle.over = true;
    battle.result = 'run';
  } else {
    out.push({ t: 'text', s: "Couldn't get away!" });
  }
  void foe;
}

// ---- catching -----------------------------------------------------------

function catchChance(battle, ball) {
  const foe = activeOf(battle.sides[1]);
  const sp = getSpecies(foe.species);
  let bonus = ball.use.rate || 1;
  if (ball.use.bonusTypes && ball.use.bonusTypes.some((t) => sp.types.includes(t))) bonus = ball.use.bonus;
  const statusBonus = foe.status === 'SLP' || foe.status === 'FRZ' ? 2
    : (foe.status === 'PAR' || foe.status === 'PSN' || foe.status === 'BRN') ? 1.5 : 1;
  const mhp = maxHp(foe);
  const a = ((3 * mhp - 2 * foe.hp) * sp.catchRate * bonus * statusBonus) / (3 * mhp);
  return { a, sp };
}

function doCatch(battle, sideIdx, ball, out) {
  const side = battle.sides[sideIdx];
  const foeSide = battle.sides[foeIndex(sideIdx)];
  const foe = activeOf(foeSide);

  if (battle.kind !== 'wild') {
    out.push({ t: 'text', s: 'You cannot throw a ball at another trainer’s Pokémon!' });
    return;
  }
  out.push({ t: 'text', s: `${side.name} threw a ${ball.name}!` });
  out.push({ t: 'throwball', ball: ball.id });

  const { a } = catchChance(battle, ball);
  // Easy mode nudges the odds; it never guarantees a catch.
  const aAdj = battle.difficulty === 'easy' ? a * 1.35 : a;
  const shakeProb = aAdj >= 255 ? 65536 : Math.floor(65536 / Math.pow(255 / Math.min(254.9, aAdj), 0.25));

  let shakes = 0;
  for (let i = 0; i < 4; i++) {
    if (aAdj >= 255 || battle.rng.int(65536) < shakeProb) shakes++;
    else break;
  }
  if (shakes >= 4) {
    out.push({ t: 'wobble', count: 3, caught: true });
    out.push({ t: 'sfx', s: 'caught' });
    out.push({ t: 'text', s: `Gotcha! ${displayName(foe)} was caught!` });
    battle.over = true;
    battle.result = 'caught';
    battle.caught = { mon: foe, ball: ball.id };
  } else {
    out.push({ t: 'wobble', count: shakes, caught: false });
    const lines = [
      'Oh no! The Pokémon broke free!',
      'Aww! It appeared to be caught!',
      'Aargh! Almost had it!',
      'Shoot! It was so close, too!',
    ];
    out.push({ t: 'text', s: lines[Math.min(shakes, 3)] });
  }
}

// ---- moves ---------------------------------------------------------------

function doMove(battle, sideIdx, action, out) {
  const side = battle.sides[sideIdx];
  const foeSide = battle.sides[foeIndex(sideIdx)];
  const user = activeOf(side);
  const target = activeOf(foeSide);
  if (!user || !target) return;

  const slot = user.moves[action.index];
  const move = slot ? getMove(slot.id) : getMove('struggle');
  const isStruggle = !slot || slot.pp <= 0;
  const used = isStruggle ? getMove('struggle') : move;

  // --- pre-move status gates ---
  if (user.status === 'FRZ') {
    if (battle.rng() < 0.2) {
      user.status = null;
      out.push({ t: 'text', s: `${displayName(user)} thawed out!` });
    } else {
      out.push({ t: 'text', s: `${displayName(user)} is frozen solid!` });
      return;
    }
  }
  if (user.status === 'SLP') {
    user.statusCounter--;
    if (user.statusCounter <= 0) {
      user.status = null;
      out.push({ t: 'text', s: `${displayName(user)} woke up!` });
    } else {
      out.push({ t: 'text', s: `${displayName(user)} is fast asleep.` });
      return;
    }
  }
  if (side.volatile.flinch) {
    out.push({ t: 'text', s: `${displayName(user)} flinched!` });
    ability.onFlinch(battle, sideIdx, abilityCtx(battle, sideIdx, out, user));
    return;
  }
  if (user.status === 'PAR' && battle.rng() < 0.25) {
    out.push({ t: 'text', s: `${displayName(user)} is paralysed! It can't move!` });
    return;
  }
  if (side.volatile.confusion > 0) {
    side.volatile.confusion--;
    if (side.volatile.confusion <= 0) {
      out.push({ t: 'text', s: `${displayName(user)} snapped out of its confusion!` });
    } else {
      out.push({ t: 'text', s: `${displayName(user)} is confused!` });
      if (battle.rng() < 0.5) {
        const dmg = Math.max(1, Math.floor(confusionDamage(battle, sideIdx)));
        user.hp = Math.max(0, user.hp - dmg);
        out.push({ t: 'sfx', s: 'hit' });
        out.push({ t: 'hp', side: sideIdx, uid: user.uid, hp: user.hp, shake: true });
        out.push({ t: 'text', s: 'It hurt itself in its confusion!' });
        return;
      }
    }
  }

  // Pressure is the defender's ability charging the attacker extra PP.
  if (!isStruggle) slot.pp = Math.max(0, slot.pp - (1 + ability.extraPpCost(target)));
  side.lastMove = used.id;

  out.push({ t: 'usemove', side: sideIdx, move: used.id });
  out.push({ t: 'text', s: `${side.isPlayer ? '' : 'Foe '}${displayName(user)} used ${used.name}!` });

  // --- accuracy ---
  if (used.acc > 0) {
    const accMod = accStage((side.boosts.acc || 0) - (foeSide.boosts.eva || 0));
    const chance = (used.acc / 100) * accMod;
    if (battle.rng() >= chance) {
      out.push({ t: 'text', s: `${displayName(user)}'s attack missed!` });
      if (used.id === 'furycutter') side.volatile.furyCutter = 0;
      return;
    }
  }

  if (used.power > 0) {
    applyDamagingMove(battle, sideIdx, used, out);
  } else {
    applyStatusMove(battle, sideIdx, used, out);
  }
}

function confusionDamage(battle, sideIdx) {
  const user = activeOf(battle.sides[sideIdx]);
  const a = effectiveStat(battle, sideIdx, 'atk');
  const d = effectiveStat(battle, sideIdx, 'def');
  return Math.floor(Math.floor(Math.floor((2 * user.level) / 5 + 2) * 40 * a / d) / 50) + 2;
}

function computeDamage(battle, sideIdx, move, opts = {}) {
  const side = battle.sides[sideIdx];
  const foeSide = battle.sides[foeIndex(sideIdx)];
  const user = activeOf(side);
  const target = activeOf(foeSide);

  const physical = move.cls === 'physical';
  const atkKey = physical ? 'atk' : 'spa';
  const defKey = physical ? 'def' : 'spd';

  let A = effectiveStat(battle, sideIdx, atkKey);
  let D = effectiveStat(battle, foeIndex(sideIdx), defKey);

  // Critical hits ignore the defender's positive defence boosts.
  const critStages = (move.crit || 0) + (side.volatile.focus ? 1 : 0);
  const critOdds = [16, 8, 4, 3, 2][Math.min(4, critStages)];
  const roll = opts.peek ? battle.scratch : battle.rng;
  const crit = opts.forceCrit || (opts.peek ? false : roll.int(critOdds) === 0);
  if (crit) {
    A = Math.max(A, statValue(user, atkKey));
    D = Math.min(D, statValue(target, defKey));
  }

  let power = move.power;
  if (move.id === 'furycutter') power = Math.min(160, 40 * Math.pow(2, side.volatile.furyCutter));
  if (move.id === 'brine' && target.hp * 2 <= maxHp(target)) power *= 2;
  if (move.id === 'revenge' && opts.tookDamage) power *= 2;

  let dmg = Math.floor(Math.floor(Math.floor((2 * user.level) / 5 + 2) * power * A / D) / 50) + 2;

  const stab = typesOf(user).includes(move.type) ? 1.5 : 1;
  // An ability that grants outright immunity zeroes the type chart, so the
  // caller's existing "doesn't affect" path handles it with no new branch.
  const eff = ability.immuneToType(target, move.type)
    ? 0 : typeMultiplier(move.type, typesOf(target));
  dmg = Math.floor(dmg * stab);
  dmg = Math.floor(dmg * eff);
  dmg = Math.floor(dmg * ability.attackMultiplier(user, move, side));
  if (crit) dmg = Math.floor(dmg * 2);
  if (user.status === 'BRN' && physical && !ability.ignoresBurnDrop(user)) dmg = Math.floor(dmg * 0.5);
  // Damage roll: 85%..100%. A peek uses the average roll so the AI's
  // evaluation is stable and costs the shared stream nothing.
  dmg = Math.floor(dmg * (opts.peek ? 0.925 : 0.85 + battle.rng() * 0.15));

  // Easy mode: the player hits a little harder and takes a little less.
  if (battle.difficulty === 'easy') {
    dmg = Math.floor(dmg * (side.isPlayer ? 1.15 : 0.85));
  }

  return { dmg: Math.max(eff === 0 ? 0 : 1, dmg), eff, crit };
}

function applyDamagingMove(battle, sideIdx, move, out) {
  const side = battle.sides[sideIdx];
  const foeSide = battle.sides[foeIndex(sideIdx)];
  const user = activeOf(side);
  const target = activeOf(foeSide);

  const hits = move.effect && move.effect.kind === 'multihit'
    ? battle.rng.range(move.effect.min, move.effect.max) : 1;

  let total = 0;
  let lastEff = 1;
  for (let i = 0; i < hits; i++) {
    if (isFainted(target)) break;
    const { dmg, eff, crit } = computeDamage(battle, sideIdx, move);
    lastEff = eff;
    if (eff === 0) {
      if (ability.immuneToType(target, move.type)) {
        out.push({ t: 'text', s: `${displayName(target)}'s ${target.ability} made it immune!` });
        ability.onImmune(battle, foeIndex(sideIdx), abilityCtx(battle, foeIndex(sideIdx), out, target));
      } else {
        out.push({ t: 'text', s: `It doesn't affect ${displayName(target)}...` });
      }
      return;
    }
    target.hp = Math.max(0, target.hp - dmg);
    total += dmg;
    out.push({ t: 'sfx', s: eff >= 2 ? 'supereffective' : eff < 1 ? 'weak' : 'hit' });
    out.push({ t: 'hit', side: foeIndex(sideIdx), eff, crit, move: move.id });
    out.push({ t: 'hp', side: foeIndex(sideIdx), uid: target.uid, hp: target.hp, shake: true });
    if (crit) out.push({ t: 'text', s: 'A critical hit!' });
  }

  if (hits > 1) out.push({ t: 'text', s: `Hit ${hits} time${hits > 1 ? 's' : ''}!` });
  const effText = effectivenessText(lastEff);
  if (effText) out.push({ t: 'text', s: effText });

  if (move.id === 'furycutter') side.volatile.furyCutter++;

  const fx = move.effect;
  if (fx && total > 0) {
    if (fx.kind === 'drain') {
      const heal = Math.max(1, Math.floor(total * fx.fraction));
      user.hp = Math.min(maxHp(user), user.hp + heal);
      out.push({ t: 'hp', side: sideIdx, uid: user.uid, hp: user.hp });
      out.push({ t: 'text', s: `${displayName(target)} had its energy drained!` });
    }
    if (fx.kind === 'recoil' && !ability.noRecoil(user)) {
      const hurt = Math.max(1, Math.floor(total * fx.fraction));
      user.hp = Math.max(0, user.hp - hurt);
      out.push({ t: 'hp', side: sideIdx, uid: user.uid, hp: user.hp, shake: true });
      out.push({ t: 'text', s: `${displayName(user)} is hit with recoil!` });
    }
    // The roll happens either way, so an ability that blocks the effect cannot
    // shift the shared random stream a link battle replays on both phones.
    if (fx.kind === 'status' && (!fx.chance || battle.rng() < fx.chance)) {
      if (!ability.blocksSecondary(target)) applyStatus(battle, foeIndex(sideIdx), fx, out);
    }
    if (fx.kind === 'stat' && (!fx.chance || battle.rng() < fx.chance)
      && !(fx.target === 'foe' && ability.blocksSecondary(target))) {
      const tgt = fx.target === 'self' ? sideIdx : foeIndex(sideIdx);
      applyStatChange(battle, tgt, fx.stat, fx.stages, out);
    }
  }
}

function applyStatusMove(battle, sideIdx, move, out) {
  const side = battle.sides[sideIdx];
  const foeSide = battle.sides[foeIndex(sideIdx)];
  const user = activeOf(side);
  const fx = move.effect;

  if (!fx) { out.push({ t: 'text', s: 'But nothing happened!' }); return; }

  switch (fx.kind) {
    case 'stat':
      applyStatChange(battle, fx.target === 'self' ? sideIdx : foeIndex(sideIdx), fx.stat, fx.stages, out);
      break;
    case 'multistat':
      for (const [st, n] of fx.stats) applyStatChange(battle, sideIdx, st, n, out);
      break;
    case 'status':
      applyStatus(battle, foeIndex(sideIdx), fx, out);
      break;
    case 'heal': {
      if (user.hp >= maxHp(user)) { out.push({ t: 'text', s: 'But it failed!' }); break; }
      user.hp = Math.min(maxHp(user), user.hp + Math.floor(maxHp(user) * fx.fraction));
      out.push({ t: 'sfx', s: 'heal' });
      out.push({ t: 'hp', side: sideIdx, uid: user.uid, hp: user.hp });
      out.push({ t: 'text', s: `${displayName(user)} regained health!` });
      break;
    }
    case 'rest': {
      if (user.hp >= maxHp(user)) { out.push({ t: 'text', s: 'But it failed!' }); break; }
      user.hp = maxHp(user);
      user.status = 'SLP';
      user.statusCounter = 2;
      out.push({ t: 'hp', side: sideIdx, uid: user.uid, hp: user.hp });
      out.push({ t: 'text', s: `${displayName(user)} slept and became healthy!` });
      break;
    }
    case 'focus':
      side.volatile.focus = true;
      out.push({ t: 'text', s: `${displayName(user)} is getting pumped!` });
      break;
    case 'flee':
      if (battle.kind === 'wild') {
        out.push({ t: 'text', s: `${displayName(user)} teleported away!` });
        battle.over = true; battle.result = 'run';
      } else out.push({ t: 'text', s: 'But it failed!' });
      break;
    default:
      out.push({ t: 'text', s: 'But nothing happened!' });
  }
  void foeSide;
}

function applyStatus(battle, sideIdx, fx, out) {
  const side = battle.sides[sideIdx];
  const mon = activeOf(side);
  if (!mon || isFainted(mon)) return;

  if (fx.status === 'flinch') {
    // Flinch only lands if the target has not moved yet this turn; the
    // engine approximates that by only setting it when the target is slower.
    if (ability.preventsFlinch(mon)) return;
    side.volatile.flinch = true;
    return;
  }
  if (fx.status === 'CNF') {
    if (side.volatile.confusion > 0) { out.push({ t: 'text', s: `${displayName(mon)} is already confused.` }); return; }
    side.volatile.confusion = battle.rng.range(2, 5);
    out.push({ t: 'text', s: `${displayName(mon)} became confused!` });
    return;
  }
  if (mon.status) {
    out.push({ t: 'text', s: `${displayName(mon)} is already ${STATUS_NAMES[mon.status] || 'affected'}.` });
    return;
  }
  // Type immunities.
  const types = typesOf(mon);
  const immune = (fx.status === 'PSN' && (types.includes('Poison') || types.includes('Steel')))
    || (fx.status === 'BRN' && types.includes('Fire'))
    || (fx.status === 'FRZ' && types.includes('Ice'))
    || (fx.status === 'PAR' && types.includes('Electric'));
  if (immune) { out.push({ t: 'text', s: "It doesn't affect it..." }); return; }

  mon.status = fx.status;
  mon.statusCounter = fx.status === 'SLP' ? battle.rng.range(1, 3) : (fx.bad ? 1 : 0);
  mon.badPoison = !!fx.bad;
  out.push({ t: 'status', side: sideIdx, status: fx.status });
  out.push({ t: 'text', s: `${displayName(mon)} was ${STATUS_NAMES[fx.status]}!` });
  ability.onStatused(battle, sideIdx, abilityCtx(battle, sideIdx, out, mon), mon, fx.status);
}

function applyStatChange(battle, sideIdx, stat, delta, out) {
  const side = battle.sides[sideIdx];
  const mon = activeOf(side);
  if (!mon || isFainted(mon)) return;
  if (delta < 0 && ability.protectsStat(mon, stat)) {
    out.push({ t: 'text', s: `${displayName(mon)}'s ${mon.ability} prevents stat loss!` });
    return;
  }
  const cur = side.boosts[stat] || 0;
  const next = Math.max(-6, Math.min(6, cur + delta));
  const label = { atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', acc: 'accuracy', eva: 'evasiveness' }[stat] || stat;
  if (next === cur) {
    out.push({ t: 'text', s: `${displayName(mon)}'s ${label} won't go ${delta > 0 ? 'higher' : 'lower'}!` });
    return;
  }
  side.boosts[stat] = next;
  const mag = Math.abs(delta) >= 2 ? 'sharply ' : '';
  out.push({ t: 'stat', side: sideIdx, stat, delta });
  out.push({ t: 'text', s: `${displayName(mon)}'s ${label} ${mag}${delta > 0 ? 'rose' : 'fell'}!` });
}

// ---- end of turn ---------------------------------------------------------

function endOfTurn(battle, out) {
  for (let i = 0; i < 2; i++) {
    const side = battle.sides[i];
    const mon = activeOf(side);
    if (!mon || isFainted(mon)) continue;
    if (mon.status === 'PSN') {
      const frac = mon.badPoison ? Math.min(15, ++mon.statusCounter) / 16 : 1 / 8;
      const dmg = Math.max(1, Math.floor(maxHp(mon) * frac));
      mon.hp = Math.max(0, mon.hp - dmg);
      out.push({ t: 'hp', side: i, uid: mon.uid, hp: mon.hp, shake: true });
      out.push({ t: 'text', s: `${displayName(mon)} is hurt by poison!` });
    } else if (mon.status === 'BRN') {
      const dmg = Math.max(1, Math.floor(maxHp(mon) / 8));
      mon.hp = Math.max(0, mon.hp - dmg);
      out.push({ t: 'hp', side: i, uid: mon.uid, hp: mon.hp, shake: true });
      out.push({ t: 'text', s: `${displayName(mon)} is hurt by its burn!` });
    }
    ability.onEndOfTurn(battle, i, abilityCtx(battle, i, out, mon), mon);
    // Held berry that triggers in a pinch.
    if (mon.heldItem) {
      const held = getItem(mon.heldItem);
      if (held && held.held && held.held.kind === 'pinch-heal' && mon.hp > 0 && mon.hp <= maxHp(mon) / 2) {
        mon.hp = Math.min(maxHp(mon), mon.hp + held.held.amount);
        mon.heldItem = null;
        out.push({ t: 'hp', side: i, uid: mon.uid, hp: mon.hp });
        out.push({ t: 'text', s: `${displayName(mon)} ate its ${held.name}!` });
      }
    }
  }
  for (const s of battle.sides) s.volatile.firstTurn = false;
}

// ---- faints, exp, end ------------------------------------------------------

function checkFaints(battle, out) {
  for (let i = 0; i < 2; i++) {
    const side = battle.sides[i];
    const mon = activeOf(side);
    if (!mon || !isFainted(mon) || battle.announcedFaints.has(mon.uid)) continue;
    battle.announcedFaints.add(mon.uid);
    onFainted(mon);
    out.push({ t: 'sfx', s: 'faint' });
    out.push({ t: 'faint', side: i });
    out.push({ t: 'text', s: `${side.isPlayer ? '' : 'Foe '}${displayName(mon)} fainted!` });

    const winnerIdx = foeIndex(i);
    const winner = battle.sides[winnerIdx];
    if (winner.isPlayer && battle.kind !== 'pvp') awardExperience(battle, winnerIdx, mon, out);
  }
  checkBattleEnd(battle, out);
}

function awardExperience(battle, sideIdx, loser, out) {
  const side = battle.sides[sideIdx];
  const participants = [...side.participants].filter((idx) => side.party[idx] && !isFainted(side.party[idx]));
  const n = Math.max(1, participants.length);
  for (const idx of participants) {
    const mon = side.party[idx];
    const amount = expYield(loser, mon.level, battle.kind === 'trainer', n);
    const scaled = battle.difficulty === 'easy' ? Math.floor(amount * 1.5) : amount;
    const before = { level: mon.level, progress: expProgress(mon) };
    out.push({ t: 'text', s: `${displayName(mon)} gained ${scaled} EXP. Points!` });
    onWonBattle(mon);
    awardEvs(mon, loser);
    const events = gainExp(mon, scaled);
    out.push({
      t: 'exp', uid: mon.uid, index: idx, amount: scaled,
      before, after: { level: mon.level, progress: expProgress(mon) },
    });
    for (const e of events) {
      if (e.type === 'level') {
        onLevelUp(mon);
        out.push({ t: 'sfx', s: 'levelup' });
        out.push({ t: 'levelup', uid: mon.uid, index: idx, level: e.level });
        out.push({ t: 'text', s: `${displayName(mon)} grew to Lv. ${e.level}!` });
      } else if (e.type === 'learn') {
        out.push({ t: 'learn', uid: mon.uid, index: idx, move: e.move });
      } else if (e.type === 'evolve') {
        out.push({ t: 'evolve', uid: mon.uid, index: idx, into: e.into });
      }
    }
  }
}

function checkBattleEnd(battle, out) {
  if (battle.over) return;
  const alive = (s) => s.party.some((m) => m && !isFainted(m));
  const aAlive = alive(battle.sides[0]);
  const bAlive = alive(battle.sides[1]);

  if (!aAlive && !bAlive) { battle.over = true; battle.result = 'draw'; return; }
  if (!bAlive) {
    battle.over = true;
    battle.result = 'win';
    const t = battle.sides[1].trainer;
    if (t) {
      out.push({ t: 'text', s: `${battle.sides[1].name} was defeated!` });
      if (t.defeat) out.push({ t: 'text', s: t.defeat, portrait: t.look });
      out.push({ t: 'prize', amount: t.prize || 0 });
    }
    return;
  }
  if (!aAlive) {
    battle.over = true;
    battle.result = 'lose';
  }
}

// True when a side needs to choose a replacement before the next turn.
function needsSwitch(battle, sideIdx) {
  const side = battle.sides[sideIdx];
  const mon = activeOf(side);
  return !!mon && isFainted(mon) && side.party.some((m) => m && !isFainted(m));
}

function forceSwitch(battle, sideIdx, index) {
  const side = battle.sides[sideIdx];
  const target = side.party[index];
  if (!target || isFainted(target)) return [];
  side.active = index;
  side.boosts = newBoosts();
  side.volatile = newVolatile();
  side.participants.add(index);
  return [
    { t: 'sendout', side: sideIdx, index },
    { t: 'text', s: `${side.isPlayer ? 'Go!' : `${side.name} sent out`} ${displayName(target)}!` },
  ];
}

// A compact snapshot for the network layer: enough for a peer to verify its
// own simulation matched, without shipping the whole battle object.
function battleChecksum(battle) {
  let h = 2166136261;
  const mix = (n) => { h ^= n | 0; h = Math.imul(h, 16777619); };

    if (tap) {
      for (let i = 0; i < n; i++) {
        if (hit(tap, rects[i].x, rects[i].y, rects[i].w, rects[i].h)) {
          this.moveIndex = i; audio.sfx('select'); this._chooseMove(i); return;
        }
      }
    }
    if (input.repeated('left') && this.moveIndex % 2 === 1) { this.moveIndex--; audio.sfx('cursor'); }
    else if (input.repeated('right') && this.moveIndex % 2 === 0 && this.moveIndex + 1 < n) { this.moveIndex++; audio.sfx('cursor'); }
    else if (input.repeated('up') && this.moveIndex >= 2) { this.moveIndex -= 2; audio.sfx('cursor'); }
    else if (input.repeated('down') && this.moveIndex + 2 < n) { this.moveIndex += 2; audio.sfx('cursor'); }
    if (input.pressed('b')) { audio.sfx('back'); this.mode = MODE.COMMAND; return; }
    if (input.pressed('a')) { audio.sfx('select'); this._chooseMove(this.moveIndex); }
  }

  _chooseMove(i) {
    const mon = activeOf(this.battle.sides[this.mySide]);
    const slot = mon.moves[i];
    if (!slot) return;
    if (slot.pp <= 0) {
      audio.sfx('deny');
      this._say('There is no PP left for that move!');
      return;
    }
    this._submit({ type: 'move', index: i });
  }

  // ---- battle bag ---------------------------------------------------------
  // Pocketed like the field bag, because reaching for a ball is the single
  // most time-critical thing a player does in this game and hunting for it in
  // a flat list is the wrong feel.

  BAG_ROWS = 4;

  /** The pockets that have something usable in them right now. */
  _bagPockets() {
    const inv = this.game.state.inventory;
    const all = battleUsable(inv);
    const order = ['Poké Balls', 'Medicine', 'Items'];
    const pockets = order
      .map((name) => ({ name, items: all.filter((e) => e.item.pocket === name) }))
      .filter((p) => p.items.length);
    // Balls are meaningless in a trainer battle, so the pocket is not offered.
    return this.battle.canCatch ? pockets : pockets.filter((p) => p.name !== 'Poké Balls');
  }

  _bagItems() {
    const pockets = this._bagPockets();
    if (!pockets.length) return [];
    this.bagPocket = Math.max(0, Math.min(this.bagPocket, pockets.length - 1));
    return pockets[this.bagPocket].items;
  }

  /**
   * One source of truth for where the bag's rows are. Hit-testing used to
   * compute its own geometry and disagree with the drawing by 18 pixels, so
   * every row's tap target sat below the row it belonged to — which is why a
   * Poké Ball could not be tapped at all.
   */
  /**
   * The bag takes the bottom of the screen rather than squeezing into the
   * message box: four rows of 10 pixels did not fit in 46, and a row a thumb
   * has to hit needs more than ten pixels anyway.
   */
  _bagBox() {
    const { width: W } = this.game.display;
    return { x: 4, y: this._boxY() - 30, w: W - 8, h: 76 };
  }

  BAG_ROW_H = 12;

  _bagRects() {
    const b = this._bagBox();
    const items = this._bagItems();
    const shown = Math.min(this.BAG_ROWS, Math.max(0, items.length - this.bagScroll));
    const out = [];
    for (let i = 0; i < shown; i++) {
      out.push({
        x: b.x + 4, y: b.y + 17 + i * this.BAG_ROW_H, w: b.w - 8, h: this.BAG_ROW_H,
        index: this.bagScroll + i,
      });
    }
    return out;
  }

  /** Tabs across the top of the bag window, one per non-empty pocket. */
  _bagTabRects() {
    const b = this._bagBox();
    const pockets = this._bagPockets();
    if (pockets.length < 2) return [];
    // Inside the window, with room kept clear on the right for the BACK chip.
    const room = b.w - 8 - 50;
    const tw = Math.min(84, Math.floor(room / pockets.length) - 2);
    return pockets.map((p, i) => ({ ...p, i, x: b.x + 4 + i * (tw + 2), y: b.y + 3, w: tw, h: 11 }));
  }

  _updateBag() {
    const pockets = this._bagPockets();
    const items = this._bagItems();
    const rows = this.BAG_ROWS;
    const tap = input.consumeTap();

    if (tap) {
      for (const t of this._bagTabRects()) {
        if (hit(tap, t.x, t.y, t.w, t.h)) { this._setBagPocket(t.i); return; }
      }
      for (const r of this._bagRects()) {
        if (hit(tap, r.x, r.y, r.w, r.h)) {
          this.bagIndex = r.index; audio.sfx('select'); this._useItem(items[this.bagIndex]); return;
        }
      }
    }

    if (!pockets.length) {
      if (input.pressed('a') || input.pressed('b') || tap) { audio.sfx('back'); this.mode = MODE.COMMAND; }
      return;
    }
    if (input.repeated('left')) this._setBagPocket((this.bagPocket - 1 + pockets.length) % pockets.length);
    if (input.repeated('right')) this._setBagPocket((this.bagPocket + 1) % pockets.length);
    if (input.repeated('up')) { this.bagIndex = (this.bagIndex - 1 + items.length) % items.length; audio.sfx('cursor'); }
    if (input.repeated('down')) { this.bagIndex = (this.bagIndex + 1) % items.length; audio.sfx('cursor'); }
    this.bagScroll = Math.max(0, Math.min(this.bagIndex - rows + 1, Math.max(0, items.length - rows)));
    if (this.bagIndex < this.bagScroll) this.bagScroll = this.bagIndex;
    if (input.pressed('b')) { audio.sfx('back'); this.mode = MODE.COMMAND; return; }
    if (input.pressed('a')) { audio.sfx('select'); this._useItem(items[this.bagIndex]); }
  }

  _setBagPocket(i) {
    if (i === this.bagPocket) return;
    this.bagPocket = i;
    this.bagIndex = 0;
    this.bagScroll = 0;
    audio.sfx('cursor');
  }

  _useItem(entry) {
    if (!entry) return;
    const item = entry.item;
    if (item.use.kind === 'ball' && this.battle.kind !== 'wild') {
      audio.sfx('deny');
      this._say('You cannot catch another trainer’s Pokémon!');
      return;
    }
    if (this.pvp) { audio.sfx('deny'); this._say('Items are switched off in link battles.'); return; }
    removeItem(this.game.state.inventory, item.id, 1);
    const target = item.use.kind === 'ball' ? null : this.battle.sides[this.mySide].active;
    this._submit({ type: 'item', item: item.id, target });
  }

  _updateParty() {
    const party = this.battle.sides[this.mySide].party;
    const tap = input.consumeTap();
    const bx = 6, by = 14;
    if (tap) {
      for (let i = 0; i < party.length; i++) {
        if (hit(tap, bx, by + i * 22, 150, 20)) { this.partyIndex = i; audio.sfx('select'); this._chooseSwitch(i); return; }
      }
    }
    if (input.repeated('up')) { this.partyIndex = (this.partyIndex - 1 + party.length) % party.length; audio.sfx('cursor'); }
    if (input.repeated('down')) { this.partyIndex = (this.partyIndex + 1) % party.length; audio.sfx('cursor'); }
    if (input.pressed('b')) { audio.sfx('back'); this.mode = MODE.COMMAND; return; }
    if (input.pressed('a')) { audio.sfx('select'); this._chooseSwitch(this.partyIndex); }
  }

  _chooseSwitch(i) {
    const side = this.battle.sides[this.mySide];
    const mon = side.party[i];
    if (!mon) return;
    if (isFainted(mon)) { audio.sfx('deny'); this._say(`${displayName(mon)} has no energy left to fight!`); return; }
    if (i === side.active) { audio.sfx('deny'); this._say(`${displayName(mon)} is already out!`); return; }
    this._submit({ type: 'switch', index: i });
  }

  _tryRun() {
    if (this.pvp) {
      this.pvp.forfeit();
      return;
    }
    if (this.battle.kind !== 'wild') {
      this._say('There is no running from a trainer battle!');
      return;
    }
    this._submit({ type: 'run' });
  }

  // Shows a line and then returns to the command menu.
  _say(text) {
    this.queue.unshift({ t: 'command' });
    this.queue.unshift({ t: 'text', s: text });
    this.mode = MODE.PLAY;
  }

  // ---- submitting a turn ---------------------------------------------------------

  _submit(action) {
    this.msg = '';
    if (this.pvp) {
      this.pvp.submitAction(action);
      this.mode = MODE.WAIT_PEER;
      this.waitT = 0;
      return;
    }
    const foeAction = chooseAiAction(this.battle, this.foeSide);
    const actions = [];
    actions[this.mySide] = action;
    actions[this.foeSide] = foeAction;
    const events = resolveTurn(this.battle, actions);
    this.queue.push(...events);
    this.mode = MODE.PLAY;
  }

  _updateWaitPeer(dt) {
    this.waitT += dt;
    if (this.pvp && this.pvp.phase === PVP_STATE.ENDED) {
      this.mode = MODE.PLAY;
    }
  }

  _updateSwitch() {
    const side = this.battle.sides[this.mySide];
    const party = side.party;
    const tap = input.consumeTap();
    const bx = 6, by = 14;
    if (tap) {
      for (let i = 0; i < party.length; i++) {
        if (hit(tap, bx, by + i * 22, 150, 20) && !isFainted(party[i])) {
          audio.sfx('select'); this._doForcedSwitch(i); return;
        }
      }
    }
    if (input.repeated('up')) { this.partyIndex = (this.partyIndex - 1 + party.length) % party.length; audio.sfx('cursor'); }
    if (input.repeated('down')) { this.partyIndex = (this.partyIndex + 1) % party.length; audio.sfx('cursor'); }
    if (input.pressed('a')) {
      if (isFainted(party[this.partyIndex])) { audio.sfx('deny'); return; }
      audio.sfx('select');
      this._doForcedSwitch(this.partyIndex);
    }
  }

  _doForcedSwitch(i) {
    if (this.pvp) {
      this.pvp.submitSwitch(i);
      this.mode = MODE.WAIT_PEER;
      return;
    }
    this.queue.push(...forceSwitch(this.battle, this.mySide, i));
    // The AI replaces its own fainted monster at the same time.
    if (needsSwitch(this.battle, this.foeSide)) {
      const idx = chooseAiSwitch(this.battle, this.foeSide);
      if (idx >= 0) this.queue.push(...forceSwitch(this.battle, this.foeSide, idx));
    }
    this.queue.push({ t: 'command' });
    this.mode = MODE.PLAY;
  }

  // ---- learn / evolve --------------------------------------------------------------

  _updateLearn() {
    const { mon, move } = this.pendingLearn || {};
    if (!mon) { this.mode = MODE.PLAY; return; }
    const n = 5;
    const tap = input.consumeTap();
    const x = 8, y = this._boxY() - 46;
    if (tap) {
      for (let i = 0; i < n; i++) {
        if (hit(tap, x, y + 6 + i * LINE, 130, LINE)) { this.learnIndex = i; audio.sfx('select'); this._resolveLearn(i); return; }
      }
    }
    if (input.repeated('up')) { this.learnIndex = (this.learnIndex - 1 + n) % n; audio.sfx('cursor'); }
    if (input.repeated('down')) { this.learnIndex = (this.learnIndex + 1) % n; audio.sfx('cursor'); }
    if (input.pressed('a')) { audio.sfx('select'); this._resolveLearn(this.learnIndex); }
    if (input.pressed('b')) { audio.sfx('back'); this._resolveLearn(4); }
    void move;
  }

  _resolveLearn(index) {
    const { mon, move } = this.pendingLearn;
    this.pendingLearn = null;
    const mv = getMove(move);
    if (index >= 4) {
      this.queue.unshift({ t: 'text', s: `${displayName(mon)} did not learn ${mv.name}.` });
    } else {
      const old = getMove(mon.moves[index].id);
      learnMove(mon, move, index);
      audio.sfx('levelup');
      this.queue.unshift({ t: 'text', s: `${displayName(mon)} forgot ${old.name}\nand learned ${mv.name}!` });
    }
    this.mode = MODE.PLAY;
  }

  _startEvolve() {
    this.evolveData = { ...this.pendingEvolve, t: 0, phase: 'grow', cancelled: false };
    this.pendingEvolve = null;
    this.mode = MODE.EVOLVE;
    audio.stopMusic();
    audio.sfx('evolve');
  }

  _updateEvolve(dt) {
    const e = this.evolveData;
    if (!e) { this.mode = MODE.PLAY; return; }
    e.t += dt;
    // B cancels, exactly like the games.
    if (input.pressed('b') && e.t < 2.6) {
      e.cancelled = true;
      this.evolveData = null;
      this.queue.push({ t: 'text', s: `${displayName(e.mon)} stopped evolving.` });
      this.mode = MODE.PLAY;
      return;
    }
    if (e.t > 3.2 && !e.done) {
      e.done = true;
      const before = displayName(e.mon);
      evolveNow(e.mon, e.into);
      recordCaught(this.game.state.dex, e.into);
      audio.sfx('caught');
      audio.cry(e.into);
      this.queue.push({ t: 'text', s: `Congratulations! ${before} evolved into ${getSpecies(e.into).name}!` });
      const learns = getSpecies(e.into).learnset.filter(([lv]) => lv <= e.mon.level).map(([, id]) => id);
      for (const id of learns.slice(-1)) {
        if (!knowsMove(e.mon, id)) {
          const idx = this.battle.sides[this.mySide].party.indexOf(e.mon);
          this.queue.push({ t: 'learn', index: idx, move: id, uid: e.mon.uid });
        }
      }
      this.queue.push({ t: 'finishEvolve' });
    }
    if (e.done && e.t > 4.2) { this.evolveData = null; this.mode = MODE.PLAY; }
  }

  // ---- ending -------------------------------------------------------------------

  _handleEnd() {
    const st = this.game.state;
    const b = this.battle;

    if (b.result === 'caught' && b.caught && !this.caughtRecorded) {
      this.caughtRecorded = true;
      const mon = b.caught.mon;
      mon.ot = st.player.name;
      mon.otId = st.player.id;
      mon.caughtBall = b.caught.ball;
      mon.caughtAt = this.opts.location || st.player.map;
      mon.caughtLevel = mon.level;
      const dest = receiveMonster(st, mon);
      st.stats.caught++;
      const newEntry = recordCaught(st.dex, mon.species);
      if (newEntry) this.queue.push({ t: 'text', s: `${displayName(mon)}'s data was added to the Pokédex.` });
      if (dest && dest.where === 'box') {
        this.queue.push({ t: 'text', s: `Your party is full, so ${displayName(mon)}\nwas sent to ${dest.boxName}.` });
      }
      // The moment it stops being a species and becomes yours.
      this.queue.push({ t: 'nickname', mon });
      this.queue.push({ t: 'finish' });
      this.mode = MODE.PLAY;
      return;
    }

    if (b.result === 'win') {
      st.stats.battlesWon++;
      const t = b.sides[this.foeSide].trainer;
      if (t && t.id) this.game.state.flags[`beat_${t.id}`] = true;
      audio.playMusic(MUSIC.victory, 'victory');
    }
    if (b.result === 'lose') {
      this.queue.push({ t: 'text', s: `${st.player.name} is out of usable Pokémon!` });
      if (this.opts.noBlackout) {
        // Sanctioned events have medical staff at the side of the floor.
        this.queue.push({ t: 'text', s: 'The match is over. Officials take your team\nstraight to the recovery room.' });
      } else {
        this.queue.push({ t: 'text', s: `${st.player.name} panicked and ran all the way\nto the last Pokémon Center...` });
      }
    }
    if (this.pendingEvolve) { this._startEvolve(); return; }
    this.queue.push({ t: 'finish' });
    this.mode = MODE.PLAY;
  }

  _finish() {
    if (this.finished) return;
    this.finished = true;
    const result = this.battle.result;
    this.result = result;
    if (this.pvp && this.pvp.phase !== PVP_STATE.ENDED) this.pvp.finishBattle();
    const cb = this.onFinish;
    this.game.screens.fade(FADE.BLACK, () => {
      this.game.screens.pop();
      if (cb) cb(result === 'win' || result === 'caught' || result === 'run');
      this.game.afterBattle(result, this.opts);
    }, { outMs: 260, inMs: 300 });
    this.mode = MODE.END;
  }

  _updateEnd() { /* waiting on the fade */ }

  // ---- rendering ----------------------------------------------------------------

  _boxY() { return this.game.display.height - 46; }

  render(ctx) {
    const { width: W, height: H } = this.game.display;
    this._drawBackdrop(ctx, W, H);
    this._drawCombatants(ctx, W, H);
    this._drawHuds(ctx, W, H);

    if (this.evolveData) { this._drawEvolution(ctx, W, H); return; }

    switch (this.mode) {
      case MODE.COMMAND: this._drawCommand(ctx, W, H); break;
      case MODE.MOVES: this._drawMoves(ctx, W, H); drawBackChip(ctx, 4, this._boxY() - 26); break;
      case MODE.BAG: this._drawBag(ctx, W, H); break;
      case MODE.PARTY:
        this._drawPartyPicker(ctx, W, H); drawBackChip(ctx, W - 52, 4); break;
      case MODE.SWITCH: this._drawPartyPicker(ctx, W, H); break;
      case MODE.LEARN: this._drawLearn(ctx, W, H); break;
      case MODE.WAIT_PEER: this._drawWaiting(ctx, W, H); break;
      default: this._drawMessage(ctx, W, H); break;
    }
  }

  _drawBackdrop(ctx, W, H) {
    const kind = this.opts.terrain || 'grass';
    const sky = kind === 'cave' ? shade(PAL.caveWall, 0.1)
      : kind === 'indoor' ? shade(PAL.wallIn, -0.05) : PAL.battleSky;
    rect(ctx, 0, 0, W, H, sky);
    // Ground band.
    const groundY = H * 0.42;
    rect(ctx, 0, groundY, W, H - groundY,
      kind === 'cave' ? PAL.caveFloor : kind === 'indoor' ? PAL.floorTile : PAL.battleGroundB);
    for (let y = groundY; y < H; y += 6) {
      rect(ctx, 0, y, W, 3, kind === 'cave' ? shade(PAL.caveFloor, 0.05)
        : kind === 'indoor' ? shade(PAL.floorTile, -0.04) : PAL.battleGroundA);
    }
    // Platforms: simple ellipses so the fighters sit in the world.
    this._platform(ctx, W - 74, groundY + 6, 62, 14, kind);
    this._platform(ctx, 46, H * 0.66, 80, 15, kind);
  }

  _platform(ctx, cx, cy, rx, ry, kind) {
    const base = kind === 'cave' ? PAL.caveFloorDark : kind === 'indoor' ? PAL.floorTileAlt : PAL.grassDark;
    for (let y = -ry; y <= ry; y++) {
      const half = rx * Math.sqrt(Math.max(0, 1 - (y / ry) ** 2));
      ctx.fillStyle = y < -ry * 0.4 ? shade(base, 0.18) : base;
      ctx.fillRect(Math.round(cx - half), Math.round(cy + y), Math.round(half * 2), 1);
    }
  }

  _drawCombatants(ctx, W, H) {
    const foeSide = this.battle.sides[this.foeSide];
    const mySide = this.battle.sides[this.mySide];
    const foe = activeOf(foeSide);
    const me = activeOf(mySide);

    // Enemy trainer sprite stands in until the first monster is out.
    if (foe) {
      const art = getSpecies(foe.species).art;
      const img = renderMonster(art, { size: 52, shiny: foe.shiny });
      const sx = W - 74 - 26 + this._shakeOffset(this.foeSide) + (1 - this.slide[this.foeSide]) * 60;
      const sy = H * 0.42 + 6 - 46 + this.faintDrop[this.foeSide] * 34;
      this._drawSprite(ctx, img, sx, sy, this.flash[this.foeSide], this.faintDrop[this.foeSide]);
    }
    if (me) {
      const art = getSpecies(me.species).art;
      const img = renderMonster(art, { size: 64, back: true, shiny: me.shiny });
      const sx = 46 - 32 + this._shakeOffset(this.mySide) - (1 - this.slide[this.mySide]) * 80;
      const sy = H * 0.66 - 56 + this.faintDrop[this.mySide] * 40;
      this._drawSprite(ctx, img, sx, sy, this.flash[this.mySide], this.faintDrop[this.mySide]);
    }
    if (this.ballAnim) this._drawBall(ctx, W, H);
  }

  _drawSprite(ctx, img, x, y, flash, drop) {
    ctx.save();
    if (drop > 0) {
      ctx.globalAlpha = Math.max(0, 1 - drop * 1.1);
      ctx.beginPath();
      ctx.rect(x, y, img.width, img.height * Math.max(0, 1 - drop));
      ctx.clip();
    }
    ctx.drawImage(img, Math.round(x), Math.round(y));
    if (flash > 0) {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.globalAlpha = flash * 0.6;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, img.width, img.height);
    }
    ctx.restore();
  }

  _shakeOffset(side) {
    if (this.shake[side] <= 0) return 0;
    return Math.round(Math.sin(this.shake[side] * 40) * this.shake[side] * 4);
  }

  _drawBall(ctx, W, H) {
    const a = this.ballAnim;
    a.t += 1 / 60;
    const tx = W - 74, ty = H * 0.42 - 14;
    if (a.phase === 'throw') {
      const p = Math.min(1, a.t / 0.5);
      const x = 40 + (tx - 40) * p;
      const y = H * 0.72 - 20 - Math.sin(p * Math.PI) * 40 + p * 8;
      this._ballSprite(ctx, x, y, a.ball, p * 8);
    } else {
      const x = tx, y = ty + 20;
      const wob = Math.sin(a.t * 9) * Math.max(0, 1 - a.t / (0.5 + a.count * 0.42)) * 4;
      this._ballSprite(ctx, x + wob, y, a.ball, 0);
      if (a.caught && a.t > 0.5 + a.count * 0.42 - 0.2) {
        drawText(ctx, '★', Math.round(x - 10), Math.round(y - 10), { color: PAL.uiHighlight });
        drawText(ctx, '★', Math.round(x + 8), Math.round(y - 8), { color: PAL.uiHighlight });
      }
    }
  }

  _ballSprite(ctx, x, y, ballId, spin) {
    const top = ballId === 'greatball' ? '#3f6fd4' : ballId === 'ultraball' ? '#20283a'
      : ballId === 'netball' ? '#3fa8b4' : '#e05248';
    x = Math.round(x); y = Math.round(y);
    ctx.fillStyle = '#20283a';
    ctx.fillRect(x - 5, y - 5, 10, 10);
    ctx.fillStyle = top;
    ctx.fillRect(x - 4, y - 4, 8, 4);
    ctx.fillStyle = '#f4f4f8';
    ctx.fillRect(x - 4, y, 8, 4);
    ctx.fillStyle = '#20283a';
    ctx.fillRect(x - 4, y - 1 + (Math.round(spin) % 2), 8, 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 3, y - 3, 2, 1);
  }

  // ---- HUD -------------------------------------------------------------------

  _drawHuds(ctx, W, H) {
    const foe = activeOf(this.battle.sides[this.foeSide]);
    const me = activeOf(this.battle.sides[this.mySide]);
    if (foe) this._monHud(ctx, foe, 6, 8, false, this.dispHp[this.foeSide]);
    // The bag takes the lower half of the screen, the way the DS bag takes the
    // lower screen — drawing your own HUD under it just leaves a sliced panel.
    if (me && this.mode !== MODE.BAG) {
      this._monHud(ctx, me, W - 122, H * 0.44, true, this.dispHp[this.mySide]);
    }
    this._partyPips(ctx, W, H);
  }

  _monHud(ctx, mon, x, y, mine, dispHp) {
    const w = 116, h = mine ? 34 : 26;
    window9(ctx, x, y, w, h, { shadow: true });
    const name = displayName(mon);

      const swapping = this.swapFrom === i;
      window9(ctx, r.x, r.y, r.w, r.h, {
        bg: swapping ? PAL.uiHighlight : sel ? shade(PAL.uiBg, 0.02) : PAL.uiBgAlt,
        frame: sel ? PAL.uiSelect : PAL.uiFrame,
      });
      const big = i === 0;
      const img = renderMonster(getSpecies(m.species).art, { size: big ? 30 : 18, shiny: m.shiny });
      ctx.drawImage(img, r.x + 3, r.y + (big ? 3 : 1));
      const tx = r.x + (big ? 36 : 23);
      label(ctx, displayName(m), tx, r.y + 3, { color: isFainted(m) ? PAL.uiShadow : PAL.uiText });
      genderMark(ctx, m.gender, tx + displayName(m).length * 6 + 2, r.y + 3);
      drawText(ctx, `Lv${m.level}`, tx, r.y + (big ? 14 : 11), { color: PAL.uiTextDim });
      hpBar(ctx, tx + 26, r.y + (big ? 16 : 13), r.w - (big ? 68 : 52), m.hp / maxHp(m));
      drawTextRight(ctx, `${m.hp}/${maxHp(m)}`, r.x + r.w - 4, r.y + 3, { color: PAL.uiTextDim });
      if (m.status) statusChip(ctx, m.status, r.x + r.w - 22, r.y + (big ? 22 : 11));
      if (big) expBar(ctx, r.x + 4, r.y + r.h - 5, r.w - 8, expProgress(m));
      if (m.shiny) drawText(ctx, '★', r.x + r.w - 10, r.y + 12, { color: PAL.uiHighlight });
      if (sel) cursor(ctx, r.x - 4, r.y + 4, { color: PAL.uiHighlight });
    });

    if (this.sub) {
      const n = this.sub.length;
      const x = W - 74, y = H - n * LINE - 14;
      window9(ctx, x, y, 70, n * LINE + 10);
      this.sub.forEach((s, i) => {
        const iy = y + 5 + i * LINE;
        if (i === this.subIndex) cursor(ctx, x + 4, iy);
        label(ctx, s, x + 12, iy);
      });
    } else {
      labelDim(ctx, this.swapFrom >= 0 ? 'Choose who to swap with.' : 'A: select   B: back', 6, H - 10);
    }
    drawControls(ctx, { alpha: 0.6, start: false, aLabel: 'A', bLabel: 'B' });
    drawBackChip(ctx, W - 52, 2);
  }

  _renderDetail(ctx, W, H) {
    const mon = this.game.state.party[this.index];
    if (!mon) { this.detail = null; return; }
    const sp = getSpecies(mon.species);
    window9(ctx, 2, 2, W - 4, H - 4);

    const img = renderMonster(sp.art, { size: 56, shiny: mon.shiny });
    ctx.drawImage(img, 8, 16);
    label(ctx, displayName(mon), 8, 6);
    genderMark(ctx, mon.gender, 8 + displayName(mon).length * 6 + 2, 6);
    drawText(ctx, `Lv${mon.level}`, 70, 6, { color: PAL.uiText });
    drawTextRight(ctx, `No.${String(sp.id).padStart(3, '0')}`, W - 8, 6, { color: PAL.uiTextDim });
    let cx = 8;
    for (const t of sp.types) cx += typeChip(ctx, t, cx, 74) + 3;

    const px = 76;
    const page = this.detail.page;
    if (page === 0) {
      const stats = allStats(mon);
      let y = 18;
      for (const k of ['hp', 'atk', 'def', 'spa', 'spd', 'spe']) {
        labelDim(ctx, STAT_SHORT[k], px, y);
        const bw = Math.min(70, Math.round(stats[k] / 3));
        rect(ctx, px + 26, y + 2, 72, 4, PAL.uiBgAlt);
        rect(ctx, px + 26, y + 2, bw, 4, shade(PAL.uiSelect, 0.15));
        drawTextRight(ctx, String(stats[k]), W - 10, y, { color: PAL.uiText });
        y += 10;
      }
      labelDim(ctx, `${natureName(mon.nature)} nature`, px, y);
    } else if (page === 1) {
      let y = 18;
      mon.moves.forEach((slot) => {
        const mv = getMove(slot.id);
        rect(ctx, px, y, W - px - 8, 9, shade(typeColor(mv.type), 0.55));
        drawText(ctx, mv.name, px + 3, y + 1, { color: PAL.uiText });
        drawTextRight(ctx, `${slot.pp}/${slot.ppMax}`, W - 12, y + 1, { color: PAL.uiTextDim });
        y += 11;
      });
      labelDim(ctx, `EXP to next: ${expToNext(mon)}`, px, y + 2);
    } else {
      labelDim(ctx, `OT: ${mon.ot || '???'}`, px, 18);
      labelDim(ctx, `ID: ${String(mon.otId ?? 0).padStart(5, '0')}`, px, 28);
      label(ctx, `Ability: ${mon.ability}`, px, 38, { color: PAL.uiText });
      // What the ability actually does, said plainly — including when the
      // honest answer is that this engine does not implement it.
      const abilityText = abilityDescription(mon.ability);
      if (abilityText) {
        labelDim(ctx, abilityText.slice(0, Math.floor((W - px - 12) / 6)), px, 48);
      }
      labelDim(ctx, `Friendship: ${friendshipLabel(mon)}`, px, 58);
      labelDim(ctx, `Met at Lv${mon.caughtLevel}`, px, 68);
      labelDim(ctx, mon.heldItem ? `Holding ${getItem(mon.heldItem).name}` : 'No held item', px, 78);
      const dex = sp.dex;
      const words = dex.split(' ');
      let line = '', y = 96;
      for (const wd of words) {
        if ((line + ' ' + wd).length > Math.floor((W - 16) / 6)) { label(ctx, line, 8, y); y += 9; line = wd; }
        else line = line ? `${line} ${wd}` : wd;
      }
      if (line) label(ctx, line, 8, y);
    }
    drawTextCentered(ctx, `${'○'.repeat(3).split('').map((c, i) => (i === page ? '●' : '○')).join(' ')}`, W / 2, H - 12, { color: PAL.uiTextDim });
    labelDim(ctx, '← →', 8, H - 12);
  }
}

class BagScreen extends Screen {
  constructor(game, opts = {}) {
    super(game);
    this.pocket = 0;
    this.index = 0;
    this.scroll = 0;
    this.mode = opts.mode || 'browse';   // browse | use | sell | pick | give
    this.target = opts.target ?? null;
    this.onPick = opts.onPick || null;
    this.message = null;
    this.messageT = 0;
  }

  get pockets() { return POCKETS; }
  get items() { return pocketContents(this.game.state.inventory, POCKETS[this.pocket]); }

  update(dt, isTop) {
    if (!isTop) return;
    if (this.messageT > 0) { this.messageT -= dt; if (this.messageT <= 0) this.message = null; }
    const items = this.items;
    const rows = Math.floor((this.game.display.height - 46) / LINE);
    const tap = input.consumeTap();
    if (tap) {
      const tabW = Math.floor(this.game.display.width / POCKETS.length);
      if (tap.y < 14) {
        const p = Math.floor(tap.x / tabW);
        if (p >= 0 && p < POCKETS.length) { this.pocket = p; this.index = 0; this.scroll = 0; audio.sfx('cursor'); return; }
      }
      for (let i = 0; i < Math.min(rows, items.length - this.scroll); i++) {
        if (hit(tap, 6, 20 + i * LINE, this.game.display.width - 12, LINE)) {
          this.index = this.scroll + i; audio.sfx('select'); this._use(); return;
        }
      }
    }
    if (input.repeated('left')) { this.pocket = (this.pocket - 1 + POCKETS.length) % POCKETS.length; this.index = 0; this.scroll = 0; audio.sfx('cursor'); }
    if (input.repeated('right')) { this.pocket = (this.pocket + 1) % POCKETS.length; this.index = 0; this.scroll = 0; audio.sfx('cursor'); }
    if (items.length) {
      if (input.repeated('up')) { const r = moveCursor(this.index, items.length, -1, rows, this.scroll); this.index = r.index; this.scroll = r.scroll; audio.sfx('cursor'); }
      if (input.repeated('down')) { const r = moveCursor(this.index, items.length, 1, rows, this.scroll); this.index = r.index; this.scroll = r.scroll; audio.sfx('cursor'); }
      if (input.pressed('a')) { audio.sfx('select'); this._use(); }
    }
    if (input.pressed('b')) { audio.sfx('back'); if (this.onPick) this.onPick(null); this.game.screens.pop(); }
  }

  _use() {
    const entry = this.items[this.index];
    if (!entry) return;
    const st = this.game.state;
    const item = entry.item;

    if (this.mode === 'pick' || this.mode === 'give') {
      if (this.mode === 'give' && !this._holdable(item)) {
        this._say(`${item.name} is not something a Pokémon can hold.`);
        audio.sfx('deny');
        return;
      }
      const cb = this.onPick; this.game.screens.pop(); if (cb) cb(item.id); return;
    }

    const u = item.use;
    if (!u) { this._say(item.desc); return; }

    if (u.kind === 'heal' || u.kind === 'revive' || u.kind === 'cure' || u.kind === 'pp' || u.kind === 'stone' || u.kind === 'tm') {
      const targetIdx = this.mode === 'use' && this.target != null ? this.target : null;
      if (targetIdx == null) {
        this.game.screens.push(new PartyScreen(this.game, {
          mode: 'pick', prompt: `Use ${item.name} on which Pokémon?`,
          onPick: (i) => { if (i != null) this._apply(item, st.party[i]); },
        }));
        return;
      }
      this._apply(item, st.party[targetIdx]);
      return;
    }
    if (u.kind === 'repel') {
      removeItem(st.inventory, item.id, 1);
      st.repelSteps = u.steps;
      this._say(`${item.name} used. Weak Pokémon will stay away.`);
      audio.sfx('select');
      return;
    }
    if (u.kind === 'escape') {
      removeItem(st.inventory, item.id, 1);
      this.game.escapeToHealPoint();
      return;
    }
    this._say(item.desc);
  }

  _apply(item, mon) {
    if (!mon) return;
    const st = this.game.state;
    const u = item.use;
    let ok = false;
    if (u.kind === 'heal') {
      if (isFainted(mon) || mon.hp >= maxHp(mon)) { this._say('It would have no effect.'); return; }
      const before = mon.hp;
      mon.hp = Math.min(maxHp(mon), mon.hp + u.amount);
      this._say(`${displayName(mon)} recovered ${mon.hp - before} HP.`);
      ok = true;
    } else if (u.kind === 'revive') {
      if (!isFainted(mon)) { this._say('It would have no effect.'); return; }
      mon.hp = Math.max(1, Math.floor(maxHp(mon) * u.fraction));
      this._say(`${displayName(mon)} was revived.`);
      ok = true;
    } else if (u.kind === 'cure') {
      if (!mon.status || !u.status.includes(mon.status)) { this._say('It would have no effect.'); return; }
      mon.status = null; mon.statusCounter = 0;
      this._say(`${displayName(mon)} is healthy again.`);
      ok = true;
    } else if (u.kind === 'pp') {
      const slot = mon.moves.find((m) => m.pp < m.ppMax);
      if (!slot) { this._say('It would have no effect.'); return; }
      slot.pp = Math.min(slot.ppMax, slot.pp + u.amount);
      this._say(`${getMove(slot.id).name} regained PP.`);
      ok = true;
    } else if (u.kind === 'stone') {
      const into = tryStone(mon, u.stone);
      if (!into) { this._say('It would have no effect.'); return; }
      audio.sfx('evolve');
      this._say(`${displayName(mon)} evolved into ${getSpecies(into).name}!`);
      ok = true;
    } else if (u.kind === 'tm') {
      const { canLearnTm, learnMove, knowsMove } = this.game.monsterApi;
      if (knowsMove(mon, u.move)) { this._say(`${displayName(mon)} already knows that move.`); return; }
      if (!canLearnTm(mon, u.move)) { this._say(`${displayName(mon)} cannot learn that move.`); return; }
      if (mon.moves.length < 4) {
        learnMove(mon, u.move);
        audio.sfx('levelup');
        this._say(`${displayName(mon)} learned ${getMove(u.move).name}!`);
      } else {
        this.game.screens.push(new ForgetMoveScreen(this.game, mon, u.move, (replaced) => {
          if (replaced) { audio.sfx('levelup'); this._say(`${displayName(mon)} learned ${getMove(u.move).name}!`); }
        }));
        return;
      }
      ok = true;
    }
    if (ok) {
      audio.sfx('heal');
      if (!item.key && u.kind !== 'tm') removeItem(st.inventory, item.id, 1);
      if (this.game.save) this.game.save.markDirty();
      if (this.mode === 'use') this.game.screens.pop();
    }
  }

  /** Key items stay in the bag; everything else can be carried. */
  _holdable(item) { return !item.key && item.pocket !== 'Key Items'; }

  _say(text) { this.message = text; this.messageT = 2.4; }

  render(ctx) {
    const { width: W, height: H } = this.game.display;
    rect(ctx, 0, 0, W, H, shade('#c88a40', -0.45));
    for (let y = 0; y < H; y += 10) rect(ctx, 0, y, W, 5, shade('#c88a40', -0.4));

    const tabW = Math.floor(W / POCKETS.length);
    POCKETS.forEach((p, i) => {
      const sel = i === this.pocket;
      rect(ctx, i * tabW, 0, tabW - 1, 13, sel ? PAL.uiBg : shade(PAL.uiFrame, 0.1));
      drawTextCentered(ctx, p.replace('\u00e9', 'e').replace('Poke ', '').toUpperCase().slice(0, 8), i * tabW + tabW / 2, 3,
        { color: sel ? PAL.uiText : PAL.uiTextLight });
    });

    const items = this.items;
    const rows = Math.floor((H - 46) / LINE);
    window9(ctx, 2, 14, W - 4, rows * LINE + 10);
    if (!items.length) {
      labelDim(ctx, 'Nothing here.', 10, 20);
    } else {
      items.slice(this.scroll, this.scroll + rows).forEach((e, i) => {
        const idx = this.scroll + i;
        const iy = 20 + i * LINE;
        if (idx === this.index) cursor(ctx, 6, iy);
        label(ctx, e.item.name, 14, iy);
        if (!e.item.key) drawTextRight(ctx, `x${e.qty}`, W - 10, iy, { color: PAL.uiTextDim });
      });
    }

    const sel = items[this.index];
    window9(ctx, 2, H - 30, W - 4, 28);
    if (this.message) {
      label(ctx, this.message, 8, H - 25);
    } else if (sel) {
      const words = sel.item.desc.split(' ');
      let line = '', y = H - 25;
      const maxc = Math.floor((W - 16) / 6);
      for (const wd of words) {
        if ((line + ' ' + wd).length > maxc) { labelDim(ctx, line, 8, y); y += 9; line = wd; }
        else line = line ? `${line} ${wd}` : wd;
      }
      if (line) labelDim(ctx, line, 8, y);
    }
    drawTextRight(ctx, money(this.game.state.inventory.money), W - 8, H - 12, { color: PAL.uiText });
  }
}
