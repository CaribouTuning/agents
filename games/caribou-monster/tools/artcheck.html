<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#2b3450;margin:0;padding:8px;font-family:monospace;color:#fff}
canvas{image-rendering:pixelated;display:block}
</style></head><body>
<canvas id="c" width="1120" height="640"></canvas>
<script type="module">
import { renderMonster } from '../src/render/monsterart.js';
import { drawChar, LOOKS } from '../src/render/sprites.js';
import { buildTileAtlas, drawTile, TILES } from '../src/render/tiles.js';

const specs = [
  ['quadruped/leaf', {key:'a',arch:'quadruped',colors:{primary:'#7ac850',secondary:'#c8a060',accent:'#f0d860',belly:'#e8e0a0'},features:['shell','leaf'],face:{}}],
  ['biped/flame',    {key:'b',arch:'biped',colors:{primary:'#f0903c',secondary:'#e05828',accent:'#f8d060',belly:'#f8e0b0'},features:['flameTail','earsTuft','crest']}],
  ['bird/wings',     {key:'c',arch:'bird',colors:{primary:'#4a7fd0',secondary:'#2f5aa0',accent:'#f8c840',belly:'#e8f0fc'},features:['wingsFeather','crest'],face:{beak:true}}],
  ['bug/antennae',   {key:'d',arch:'bug',colors:{primary:'#a8c040',secondary:'#7a9028',accent:'#e8e070',belly:'#d8e090'},features:['wingsBug','horn']}],
  ['fish/fins',      {key:'e',arch:'fish',colors:{primary:'#f0c040',secondary:'#e07830',accent:'#f8e8a0',belly:'#f8f0d0'},features:['fins']}],
  ['rodent/ears',    {key:'f',arch:'rodent',colors:{primary:'#3a6fd0',secondary:'#28509a',accent:'#f8d040',belly:'#d8e4f8'},features:['earsPointed','starTail']}],
  ['golem/rock',     {key:'g',arch:'golem',colors:{primary:'#9a9284',secondary:'#7e766a',accent:'#bdb5a6',belly:'#b0a89a'},features:['spikes']}],
  ['bat/wings',      {key:'h',arch:'bat',colors:{primary:'#7a68b0',secondary:'#5a4a90',accent:'#e05a7a',belly:'#a898d0'},features:['earsPointed'],face:{fang:true}}],
  ['blob/bloom',     {key:'i',arch:'blob',colors:{primary:'#68b850',secondary:'#4a9038',accent:'#f070a0',belly:'#a8d890'},features:['bloom','earsRound']}],
  ['serpent/coil',   {key:'j',arch:'serpent',colors:{primary:'#68c8b0',secondary:'#3a9a88',accent:'#f0e060',belly:'#c8f0e0'},features:['horn','collar']}],
  ['stag/antlers',   {key:'k',arch:'stag',colors:{primary:'#d8c8a0',secondary:'#a89060',accent:'#f8e070',belly:'#f0e8d0'},features:['antlers','mane','halo','gem']}],
  ['quad/bushy',     {key:'l',arch:'quadruped',colors:{primary:'#8a6a48',secondary:'#6a4a30',accent:'#e8d0a0',belly:'#d8c0a0'},features:['earsRound','bushyTail','flatTail']}],
];

const c = document.getElementById('c').getContext('2d');
c.imageSmoothingEnabled = false;
c.fillStyle = '#2b3450'; c.fillRect(0,0,1120,640);

specs.forEach((s, i) => {
  const col = i % 6, row = Math.floor(i / 6);
  const x = 10 + col * 184, y = 10 + row * 150;
  c.fillStyle = '#a8dcf4'; c.fillRect(x, y, 176, 118);
  c.drawImage(renderMonster(s[1], {size:64}), x + 4, y + 4);
  c.drawImage(renderMonster(s[1], {size:64, back:true}), x + 70, y + 4);
  c.drawImage(renderMonster(s[1], {size:24}), x + 138, y + 4);
  c.drawImage(renderMonster(s[1], {size:24, shiny:true}), x + 138, y + 32);
  c.drawImage(renderMonster(s[1], {size:40}), x + 132, y + 62);
  c.fillStyle = '#fff'; c.font = '11px monospace'; c.fillText(s[0], x + 4, y + 132);
});

// characters
const looks = Object.entries(LOOKS);
looks.forEach(([name, look], i) => {
  const x = 10 + (i % 20) * 54, y = 320;
  c.fillStyle = '#6cb04a'; c.fillRect(x, y, 52, 96);
  ['down','up','left','right'].forEach((d, di) => {
    for (let f = 0; f < 3; f++) drawChar(c, name + d, look, d, f, x + f*17, y + 4 + di*22);
  });
  c.fillStyle = '#fff'; c.font = '9px monospace'; c.fillText(name.slice(0,8), x + 2, y + 106);
});

// tiles
buildTileAtlas();
const keys = Object.keys(TILES);
keys.forEach((k, i) => {
  const x = 10 + (i % 30) * 36, y = 450 + Math.floor(i / 30) * 44;
  c.fillStyle='#000'; c.fillRect(x-1,y-1,34,34);
  for (let f=0; f<1; f++) { c.save(); c.translate(x,y); c.scale(2,2); drawTile(c, k, 0, 0, 0); c.restore(); }
  c.fillStyle = '#fff'; c.font = '10px monospace'; c.fillText(k, x + 12, y + 42);
});
window.__ready = true;
</script></body></html>
